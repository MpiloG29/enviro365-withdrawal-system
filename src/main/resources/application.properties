spring.application.name=enviro365-withdrawal-system

spring.datasource.url=jdbc:h2:mem:withdrawaldb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql only after Hibernate has created the schema, otherwise the inserts fail against tables that don't exist yet
spring.jpa.defer-datasource-initialization=true

# Off, not the Spring Boot default of true: with it on, the Hibernate session stays open through controller
# and JSON serialization, which would silently paper over missing @Transactional boundaries around lazy
# associations (Investor.products, WithdrawalNotice.product) instead of failing fast where the bug actually is.
spring.jpa.open-in-view=false
