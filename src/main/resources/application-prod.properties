# Activated via SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile) for deployed environments only - local
# `mvn spring-boot:run` still uses the base application.properties, where the H2 console stays enabled for
# development convenience.

# The H2 console has no password on this project (sa / blank) - fine on localhost, not fine on a public URL,
# where it would give anyone read/write access to the database. Overrides the base spring.h2.console.enabled=true.
spring.h2.console.enabled=false
