<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviro365 Withdrawal System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Enviro365 Investments</h1>
        <p class="app-subtitle">Withdrawal Notice System</p>
    </header>

    <main>
        <!-- Investor selection: dropdown of the three seeded investors, or a manual id lookup for anything
             else (including deliberately testing an id that doesn't exist). -->
        <section class="card" aria-labelledby="investor-heading">
            <h2 id="investor-heading">Investor</h2>
            <div class="investor-picker">
                <label for="investor-select">Select investor</label>
                <select id="investor-select">
                    <option value="">-- choose an investor --</option>
                    <option value="1">Thandiwe Nkosi (id 1)</option>
                    <option value="2">Sipho Mahlangu (id 2)</option>
                    <option value="3">Lerato Dube (id 3)</option>
                </select>

                <span class="picker-divider">or</span>

                <label for="investor-id-input">Load by id</label>
                <input type="number" id="investor-id-input" min="1" step="1" placeholder="e.g. 4">
                <button type="button" id="load-by-id-btn">Load</button>
            </div>
            <div id="investor-error" class="error-banner" hidden></div>
        </section>

        <!-- Portfolio dashboard -->
        <section class="card" id="dashboard-section" hidden aria-labelledby="dashboard-heading">
            <h2 id="dashboard-heading">Portfolio</h2>
            <div class="investor-summary">
                <span id="investor-name"></span>
                <span id="investor-age" class="muted"></span>
            </div>
            <div id="product-cards" class="product-cards"></div>
        </section>

        <!-- Withdrawal form -->
        <section class="card" id="withdrawal-section" hidden aria-labelledby="withdrawal-heading">
            <h2 id="withdrawal-heading">Submit a withdrawal</h2>
            <form id="withdrawal-form" novalidate>
                <div class="form-row">
                    <label for="product-select">Product</label>
                    <select id="product-select"></select>
                    <span class="field-error" id="product-error"></span>
                </div>
                <div class="form-row">
                    <label for="amount-input">Amount (ZAR)</label>
                    <input type="number" id="amount-input" step="0.01" placeholder="0.00">
                    <span class="field-error" id="amount-error"></span>
                </div>
                <button type="submit" id="submit-withdrawal-btn">Submit withdrawal</button>
                <div id="withdrawal-message" class="message-banner" hidden></div>
            </form>
        </section>

        <!-- Withdrawal history -->
        <section class="card" id="history-section" hidden aria-labelledby="history-heading">
            <h2 id="history-heading">Withdrawal history</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Balance after</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
            <p id="history-empty" class="muted" hidden>No withdrawals yet.</p>
        </section>

        <!-- CSV statement export -->
        <section class="card" id="csv-section" hidden aria-labelledby="csv-heading">
            <h2 id="csv-heading">Download statement</h2>
            <div class="csv-controls">
                <label for="csv-from">From</label>
                <input type="date" id="csv-from">
                <label for="csv-to">To</label>
                <input type="date" id="csv-to">
                <button type="button" id="csv-download-btn">Download CSV</button>
            </div>
            <div id="csv-message" class="message-banner" hidden></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
